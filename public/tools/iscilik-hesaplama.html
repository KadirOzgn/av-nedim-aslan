<script>
  (function(){
    try {
      if (window.location.search.includes('embed=1') || window.location.hash.includes('embed=1')) {
        document.documentElement.classList.add('embed');
        
        function enforceTheme() {
          try {
            var isDark = window.parent.document.documentElement.classList.contains('dark');
            var targetTheme = isDark ? 'dark' : 'light';
            if (document.documentElement.dataset.theme !== targetTheme) {
              document.documentElement.dataset.theme = targetTheme;
            }
            if (isDark) {
              document.documentElement.classList.add('dark');
            } else {
              document.documentElement.classList.remove('dark');
            }
          } catch(e) {}
        }
        
        enforceTheme();
        
        // Prevent React from overriding the theme
        var selfObserver = new MutationObserver(enforceTheme);
        selfObserver.observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
        
        // Listen to parent theme changes
        try {
          var parentObserver = new MutationObserver(enforceTheme);
          parentObserver.observe(window.parent.document.documentElement, { attributes: true, attributeFilter: ['class'] });
        } catch(e) {}
      }
    } catch(e) {}
  })();
</script>

.party-row input, .party-row select { width: 100%; min-width: 0; min-height: 37px; padding: 0 9px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--surface); color: var(--ink); font-size: 8px; }

.share-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
.exposure-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(135px, 1fr)); gap: 8px; margin-top: 12px; }
.exposure-grid span { padding: 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-blue); }

.net-result-grid { display: grid; grid-template-columns: repeat(4, 1fr) 1.4fr; gap: 7px; margin-top: 12px; }

.scenario-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 9px; }
.scenario-card { padding: 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-soft); }

.scenario-card .field input { min-height: 34px; padding: 0 7px; font-size: 8px; }
.pro-issues { display: grid; gap: 8px; margin-top: 11px; }
.professional-export { display: flex; justify-content: space-between; align-items: center; gap: 18px; margin-top: 10px; padding: 16px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); }
.professional-export h3, .professional-export p { margin: 0; }

.binary-choice {

}

.binary-choice button {

}

.binary-choice button.selected {

  color: var(--brand-dark);

}
.professional-export > div:last-child { display: flex; gap: 8px; flex: 0 0 auto; }

footer { display: flex; justify-content: space-between; gap: 16px; padding: 19px 2px 0; color: var(--muted); font-size: 10px; }
footer p { margin: 0; }

@media (max-width: 1120px) {

/* v6 · ferah ve hukuk bürosu odaklı arayüz */
:root {
  --bg: #f5f7fa;
  --surface: #ffffff;
  --surface-soft: #f8fafc;
  --surface-blue: #eef4f8;
  --ink: #14263a;
  --ink-soft: #53677b;
  --muted: #6b7d8e;
  --line: #dbe3ea;
  --line-strong: #bdcbd7;
  --brand: #124f78;
  --brand-dark: #0b3858;
  --brand-soft: #e8f1f7;
  --accent: #2379aa;
  --shadow: 0 14px 38px rgba(22, 50, 76, .07);
}

html[data-theme="dark"] {
  --bg: #071522;
  --surface: #0d2437;
  --surface-soft: #102a40;
  --surface-blue: #12324c;
  --ink: #f3f8fc;
  --ink-soft: #c0d0dd;
  --muted: #9eb2c2;
  --line: #26465e;
  --line-strong: #3b607b;
  --brand: #72c3ef;

  --brand-soft: #123d5a;
  --accent: #8bd0f4;
  --shadow: 0 18px 42px rgba(0, 0, 0, .24);
}

body {
  background:
    radial-gradient(circle at 12% -10%, color-mix(in srgb, var(--brand) 7%, transparent), transparent 30%),
    var(--bg);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, Helvetica, sans-serif;

}

.topbar {

}

html[data-theme="dark"] .topbar {

}

.topbar-inner,

}

}

.brand-block { gap: 14px; }

  .field-grid.three,
  .expert-checks,
  .scope-check-grid,
  .claim-grid,
  .source-grid { grid-template-columns: 1fr; }
  .field select,
  .field input { min-height: 48px; font-size: 16px; }
  .field > span { font-size: 12.5px; }
  .field > small { font-size: 10.5px; }
  .citizen-section { margin-top: 23px; }
  .citizen-total strong { font-size: 30px; }
  .professional-head,
  .professional-export { padding: 17px; }
  .pro-module-body { padding: 13px; }
}

@media print {
  :root, html[data-theme="dark"] { --bg: #fff; --surface: #fff; --ink: #111; --ink-soft: #444; --muted: #666; --line: #ddd; }
  /* removed display none */
  .page-wrap { width: 100%; padding: 0; }
  .workspace-grid { display: block; }
  .summary-card { border: 0; box-shadow: none; }
  .form-card.result-report { display: block !important; border: 0; box-shadow: none; padding: 0; }
  .summary-card, .form-actions, .result-setup, .source-panel { display: none !important; }
  .section-heading { break-after: avoid; }
  .claim-result, .net-boundary, .audit-panel { break-inside: avoid; }
  .report-hero { background: #174f77 !important; print-color-adjust: exact; -webkit-print-color-adjust: exact; }
  .claim-result details { display: block; }
  .claim-result details:not([open]) > :not(summary) { display: grid !important; }
  .audit-details > summary { display: none; }
  .audit-details > .audit-details-body { display: block !important; padding: 0; }
  .professional-toolkit { break-before: page; }
  .professional-head, .professional-export { break-inside: avoid; }
  .pro-module { break-inside: auto; }
  .pro-module > summary { break-after: avoid; }
  .pro-module:not([open]) > :not(summary) { display: block !important; }
  .module-toggle, .module-actions, .professional-export button, .remove-button, .wide-add-button { display: none !important; }
  .pro-card, .scenario-card, .formula-note, .net-result-grid { break-inside: avoid; }
}

/* Sade kurumsal görünüm */
.topbar { background: var(--surface); border-bottom: 1px solid var(--line); }
.brand-mark { background: var(--brand-dark); border-radius: 4px; }
.status-chip, .version-chip { background: transparent; border: 0; border-radius: 0; color: var(--muted); }
.status-chip i, .banner-icon { display: none; }
.legal-banner { background: var(--surface); border: 0; border-left: 3px solid var(--brand); border-radius: 0; }
.mode-tabs { background: transparent; border-radius: 0; }
.mode-tabs button { border-radius: 0; border-bottom: 2px solid transparent; }
.mode-tabs button.active { border-bottom-color: var(--brand); background: var(--surface); }
.section-kicker, .eyebrow { letter-spacing: .04em; }
button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }

.report-hero { background: var(--brand-dark); color: #fff; }

.mode-tabs button.active { color: var(--brand); }
.mode-tabs button.active small { color: var(--muted); }
</style>
<style>
/* Embed mode overrides to match infaz-hesaplama theme structure */
html.embed, html.embed body { background: transparent !important; }

html.embed body .legal-banner { display: none !important; }

</style>
<style>.brand-block .brand-mark, .brand-block .eyebrow { display: none !important; }</style>
