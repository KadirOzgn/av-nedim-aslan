function validDate(date){if(!/^\d{4}-\d{2}-\d{2}$/.test(date||""))throw Error("Geçerli bir tarih girin.");const d=new Date(date+"T12:00:00Z");if(!Number.isFinite(d.getTime())||d.toISOString().slice(0,10)!==date)throw Error("Geçerli bir tarih girin.");return date}
function tariff(date){validDate(date);const t=TARIFFS[Number(date.slice(0,4))];if(!t)throw Error("Yalnız 2025 ve 2026 tarifeleri desteklenir.");return t}
function cents(value){if(typeof value==="number"){if(!Number.isFinite(value)||value<0)throw Error("Tutar geçersiz.");return cents(String(value))}let s=String(value==null?"":value).trim().replace(/\s/g,"");if(!s)return 0;if(s.includes(",")&&s.includes("."))s=s.replace(/\./g,"").replace(",",".");else if(s.includes(","))s=s.replace(",",".");else if(/^\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,"");if(!/^\d+(\.\d{0,2})?$/.test(s))throw Error("Tutarı en fazla iki ondalık basamakla girin.");const parts=s.split("."),a=Number(parts[0]),b=Number(((parts[1]||"")+"00").slice(0,2));if(!Number.isSafeInteger(a)||a>Math.floor((Number.MAX_SAFE_INTEGER-b)/100))throw Error("Tutar güvenli hesap sınırını aşıyor.");return a*100+b}

const rate=(base,pair)=>mulDiv(base,pair[0],pair[1]),rateFor=key=>R[key]||R.general,minNispi=(n,t)=>Math.max(n,t.fixed),offset=(due,paid)=>({remaining:Math.max(0,due-paid),excess:Math.max(0,paid-due),used:Math.min(due,paid)});

function decisionTotal(value,rateKey,t){return rateKey==="fixed"?t.fixed:minNispi(rate(value,rateFor(rateKey)),t)}

function opening(o){const t=o.t,rows=[line("app","Başvurma harcı",t.app[o.court],"Başvurulan mahkeme veya merciye göre maktu harç.")];let advance=0,note="",warning="";if(o.court==="aym"){const x=payment(rows,"paidApp","Ödenen bireysel başvuru harcı",t.app.aym,o.paidApp);return finish("Anayasa Mahkemesi bireysel başvuru harcı",rows,"Bireysel başvuruda ayrıca peşin karar ve ilam harcı eklenmedi.","Kabul edilebilirlik ve süre koşulları bu araçta incelenmez.",x.excess)}
 if(["nonmoney","recognition"].includes(o.type))advance=t.fixed;
 else if(["sale","division"].includes(o.type)){advance=t.fixed;note="Açılışta maktu karar harcı gösterildi. Satış veya taksim sonunda özel nispi harç, matrah kesinleşince ayrıca hesaplanır."}
 else if(o.type==="movable"){advance=t.fixed;warning="Taşınır ortaklığının giderilmesinde matrah ve karar harcı talep biçimine göre değişebildiğinden UYAP tahakkukundan teyit edilmelidir."}

 else if(o.type==="auctionListed"){advance=t.fixed;warning="İİK m.134/2'de sayılan başvuranlar bakımından harç ve teminat, başvuran sıfatıyla birlikte UYAP'tan teyit edilmelidir."}

 else{let value=o.value,rateKey="general",div=4;if(["eviction","rentfix","rentadapt"].includes(o.type))value=mulDiv(value,12,1);if(["alimony","alimonyUp"].includes(o.type)){value=mulDiv(value,12,1);rateKey="alimony"}if(o.type==="injury")div=20;advance=Math.max(mulDiv(rate(value,rateFor(rateKey)),1,div),t.fixed);if(o.type==="foreign")warning="Parasal yabancı kararın tenfizinde nispi/maktu uygulama yönünden UYAP tahakkuku teyit edilmelidir."}
 if(advance)rows.push(line("advance","Peşin karar ve ilam harcı",advance,o.type==="auctionOutsider"?"Toplam nispi harcın yarısı peşin.":o.type==="injury"?"Ölüm ve cismani zararda yirmide bir peşin; asgari tutar kontrolü uygulandı.":"Karar ve ilam harcının peşin kısmı; asgari tutar kontrolü uygulandı."));
 let excess=payment(rows,"paidApp","Ödenen başvurma harcı",t.app[o.court],o.paidApp).excess;if(advance)excess+=payment(rows,"paidDecision","Ödenen peşin karar harcı",advance,o.paidDecision).excess;return finish("Dava açılış harçları",rows,note,warning,excess)}

function appeal(o){const t=o.t,rows=[],app=t.appeal[o.route],decision=o.side==="debtor"?Math.max(mulDiv(rate(o.value,rateFor(o.rateKey)),1,4),t.fixed):t.fixed;rows.push(line("appealApp","Kanun yolu başvurma harcı",app,"Seçilen istinaf veya temyiz merciine göre maktu harç."),line("appealDecision",o.side==="debtor"?"Peşin nispi kanun yolu karar harcı":"Maktu kanun yolu karar harcı",decision,o.side==="debtor"?"Başvuruya konu aleyhe miktarın nispi harcının dörtte biri; alt sınır uygulandı.":"Davacı veya maktu karar başvurusu için maktu harç."));let excess=payment(rows,"paidAppealApp","Ödenen başvurma harcı",app,o.paidApp).excess;excess+=payment(rows,"paidAppealDecision","Ödenen karar harcı",decision,o.paidDecision).excess;return finish("Kanun yolu harçları",rows,"","Araç kararın kanun yoluna açık olup olmadığını ve parasal kesinlik sınırını belirlemez; karar tarihi ve türü ayrıca kontrol edilmelidir.",excess)}

if(mode==="result"){const type=val("#resultType"),transaction=["proceduralAccept","withdraw","settle"].includes(type),value=["judgmentAccept",...["proceduralAccept","withdraw","settle"]].includes(type);hide("#resultRateW",!value);hide("#resultValueW",!value||val("#resultRate")==="fixed");hide("#stageW",!transaction)}
if(mode==="appeal"){const debtor=val("#side")==="debtor";hide("#appealValueW",!debtor);hide("#appealRateW",!debtor)}
if(mode==="execution"){const type=val("#execType");["opening","collection","withdrawal","delivery","renewal","bankruptcy"].forEach(x=>hide("#ex-"+x,type!==x));hide("#deliveryStageW",val("#deliveryType")==="nonValue");hide("#deliveryValueW",val("#deliveryType")==="nonValue");hide("#renewalValueW",val("#renewalType")!=="expired");hide("#bankruptcyValueW",val("#bankruptcyType")==="opening")}
if(mode==="other"){hide("#otherHearing",val("#otherType")!=="hearing");hide("#otherCopy",val("#otherType")!=="copy")}hide("#ceypW",!(mode==="execution"&&["worker","verified"].includes(val("#relief"))))}
function invalidate(){$("#result").className="empty";$("#result").textContent="Bilgiler değişti. Güncel sonucu görmek için Hesapla düğmesine basın.";$("#error").classList.add("hidden")}
$("#form").addEventListener("input",invalidate);$("#form").addEventListener("change",invalidate);
function calculate(){invalidate();const t=tariff(val("#date"));let r;
if(mode==="case"){const type=val("#caseType"),need=val("#court")!=="aym"&&!["nonmoney","recognition","sale","division","movable","alimonyDown","auctionListed"].includes(type);r=opening({t,type,value:need?positive("#caseValue","Harca esas tutar"):0,court:val("#court"),paidApp:num("#casePaidApp"),paidDecision:num("#casePaidDecision")})}
if(mode==="result"){const type=val("#resultType"),need=["judgmentAccept","proceduralAccept","withdraw","settle"].includes(type)&&val("#resultRate")!=="fixed";r=resultFee({t,type,value:need?positive("#resultValue","Hükme esas tutar"):0,rateKey:val("#resultRate"),stage:val("#stage"),paid:num("#resultPaid")})}
if(mode==="increase")r=increase({t,kind:val("#increaseType"),filing:val("#filing"),date:val("#date"),value:positive("#increaseValue","Artırılan miktar"),rateKey:val("#increaseRate"),paid:num("#increasePaid")});
if(mode==="appeal"){const side=val("#side");r=appeal({t,route:val("#route"),side,value:side==="debtor"?positive("#appealValue","Aleyhe miktar"):0,rateKey:val("#appealRate"),paidApp:num("#appealPaidApp"),paidDecision:num("#appealPaidDecision")})}
if(mode==="execution"){const type=val("#execType");if(type==="opening")r=execution({t,type,track:val("#track"),value:positive("#trackValue","Takip tutarı"),paidApp:num("#execOpenPaidApp"),paidAdvance:num("#execOpenPaidAdvance")});if(type==="collection")r=execution({t,type,stage:val("#collectionStage"),value:positive("#collected","Tahsil edilen tutar"),officePaid:num("#officePaid"),paidCollection:num("#execPaidCollection")});if(type==="withdrawal")r=execution({t,type,stage:val("#withdrawalStage"),value:positive("#withdrawalValue","Vazgeçilen miktar"),paid:num("#withdrawalPaid")});if(type==="delivery")r=execution({t,type,deliveryType:val("#deliveryType"),stage:val("#deliveryStage"),value:val("#deliveryType")==="nonValue"?0:positive("#deliveryValue","Harca esas değer"),paid:num("#deliveryPaid")});if(type==="renewal")r=execution({t,type,renewal:val("#renewalType"),value:val("#renewalType")==="expired"?positive("#renewalValue","Takip tutarı"):0});if(type==="bankruptcy")r=execution({t,type,bankruptcyType:val("#bankruptcyType"),value:val("#bankruptcyType")==="opening"?0:positive("#bankruptcyValue","Harca esas tutar")})}
if(mode==="other"){const type=val("#otherType"),count=Number(val("#copyCount")||1);if(type==="copy"&&(!Number.isInteger(count)||count<1||!Number.isSafeInteger(count)))throw Error("Sayfa sayısı en az 1 olmalıdır.");r=other({t,type,court:val("#hearingCourt"),value:type==="hearing"?num("#hearingValue"):0,copyType:val("#copyType"),count,paid:num("#otherPaid")})}render(r)}
function basis(s){return s?`<div class="basis">Dayanak: <a href="${s.url}" target="_blank" rel="noopener">${s.label}</a></div>`:""}
function render(raw){const r=applyRelief(raw,val("#relief"),mode,$("#ceyp").checked),items=r.rows.map(x=>`<div class="item"><div class="lh"><span>${x.label}</span><strong>${x.amount<0?"− ":""}${money(Math.abs(x.amount))}</strong></div><div class="why">${x.why}</div>${basis(x.basis)}</div>`).join("");$("#result").className="";$("#result").innerHTML=`<span class="pill">${tariff(val("#date")).year} tarifesi</span><div class="small">Ödenecek harç</div><div class="total">${money(r.payable)}</div>${r.payable!==r.gross?`<div class="gross">Hesaplanan harç: ${money(r.gross)}</div>`:""}<strong>${r.title}</strong><div class="small">İşlem tarihi: ${val("#date")} · ${$("#title").textContent}</div>${items}${r.reliefText?`<div class="info">${r.reliefText}</div>`:""}${r.excess?`<div class="info">Fazla ödenen tutar: <strong>${money(r.excess)}</strong>. İade durumu dosyadan teyit edilmelidir.</div>`:""}${r.note?`<div class="note">${r.note}</div>`:""}${r.warning?`<div class="danger">${r.warning}</div>`:""}<div class="legal">Bu hesap resmî tahakkuk belgesi değildir. Teyit gerektiren durumlarda UYAP tahakkuku esas alınır.<br><strong>Hesaba dahil değildir:</strong> gider avansı, tebligat ve posta gideri, bilirkişi ücreti, keşif gideri, teminat, vekalet pulu ve avukatlık ücreti. Keşif harcı seçilirse yalnız harç hesaplanır.</div><button class="btn alt" type="button" onclick="window.print()">Yazdır / PDF</button>`}
$$(".tab").forEach(b=>b.addEventListener("click",()=>{mode=b.dataset.mode;$$(".tab").forEach(x=>x.classList.toggle("active",x===b));$("#title").textContent={case:"Dava açılışı",result:"Dava sonucu",increase:"Talep artırımı",appeal:"İstinaf / temyiz",execution:"İcra harçları",other:"Diğer harçlar"}[mode];$("#result").className="empty";$("#result").textContent="Hesaplama sonucu burada gösterilir.";$("#error").classList.add("hidden");loadFields()}));
$("#relief").addEventListener("change",update);$("#form").addEventListener("submit",e=>{e.preventDefault();$("#error").classList.add("hidden");try{calculate()}catch(x){$("#error").textContent=x&&x.message?x.message:"Hesaplama sırasında beklenmeyen bir hata oluştu.";$("#error").classList.remove("hidden")}});$("#theme").addEventListener("click",()=>{const d=document.documentElement.dataset.theme==="dark",next=d?"light":"dark";document.documentElement.dataset.theme=next;try{localStorage.setItem("aslan-theme",next)}catch(x){}});try{const saved=localStorage.getItem("aslan-theme");if(saved==="light"||saved==="dark")document.documentElement.dataset.theme=saved}catch(x){}
const today=new Date();$("#date").value=today.getFullYear()+"-"+String(today.getMonth()+1).padStart(2,"0")+"-"+String(today.getDate()).padStart(2,"0");loadFields();const check=selfTest();$("#testStatus").textContent=check.pass?` · Hesap motoru kontrolü: ${check.passed}/${check.total}`:" · Hesap motoru kontrolü başarısız";$("#testStatus").className=check.pass?"ok":"error";if(!check.pass){$("#calculate").disabled=true;$("#error").textContent="Hesap motoru iç kontrolü geçemedi; araç kullanıma kapatıldı.";$("#error").classList.remove("hidden")}}
})();
</script>

<script>
  // Sync theme with parent site
  window.addEventListener('message', function(event) {
    if (event.data && event.data.type === 'theme') {
      if (event.data.theme === 'dark') {
        document.documentElement.dataset.theme = 'dark';
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      } else {
        document.documentElement.dataset.theme = 'light';
        document.documentElement.classList.remove('dark');
        document.documentElement.style.colorScheme = 'light';
      }
    }
  });
  // Read initial theme from parent
  try {
    if (window.parent && window.parent.document) {
      var isDark = window.parent.document.documentElement.classList.contains('dark');
      if (isDark) document.documentElement.dataset.theme = 'dark';
    }
  } catch(e) {}
  if (typeof ResizeObserver !== 'undefined') {
    let lastHeight = 0;
    const sendHeight = () => {
      const root = document.getElementById('root') || document.querySelector('.shell') || document.body;
      const height = root.offsetHeight || root.scrollHeight;
      if (Math.abs(lastHeight - height) > 5) {
        lastHeight = height;
        window.parent.postMessage({ type: 'resize', height: height }, '*');
      }
    };
    const resizeObserver = new ResizeObserver(sendHeight);
    window.addEventListener('load', () => {
      const root = document.getElementById('root') || document.querySelector('.shell') || document.body;
      resizeObserver.observe(root);
      sendHeight();
    });
    setTimeout(sendHeight, 500);
    setTimeout(sendHeight, 1500);
  }
</script>
